<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BBW Football Academy | Kaduna</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #07111f;
    color: #ffffff;
    line-height: 1.6;
}

a {
    text-decoration: none;
    color: inherit;
}

.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(5, 12, 23, 0.96);
    border-bottom: 1px solid #26364a;
    padding: 15px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    font-weight: 900;
    color: #f5c400;
}

.logo img {
    height: 50px;
    width: auto;
}

.logo span {
    display: block;
    color: white;
    font-size: 11px;
    letter-spacing: 2px;
}

.nav-links {
    display: flex;
    gap: 20px;
    font-size: 14px;
}

.nav-links a:hover {
    color: #f5c400;
}

.hero {
    min-height: 90vh;
    display: flex;
    align-items: center;
    padding: 70px 7%;
    background:
        linear-gradient(90deg, rgba(3,10,20,.98), rgba(3,10,20,.72)),
        radial-gradient(circle at 80% 40%, #153b62, #07111f 60%);
}

.hero-content {
    max-width: 750px;
}

.badge {
    display: inline-block;
    background: #f5c400;
    color: #07111f;
    padding: 8px 15px;
    border-radius: 30px;
    font-weight: 800;
    font-size: 13px;
    margin-bottom: 20px;
}

.hero h1 {
    font-size: clamp(42px, 8vw, 82px);
    line-height: 1;
    margin-bottom: 22px;
}

.hero h1 span {
    color: #f5c400;
}

.hero p {
    color: #d8e1eb;
    font-size: 19px;
    max-width: 650px;
    margin-bottom: 30px;
}

.buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.btn {
    padding: 14px 24px;
    border-radius: 8px;
    font-weight: 800;
    display: inline-block;
    border: 2px solid #f5c400;
}

.btn-primary {
    background: #f5c400;
    color: #07111f;
}

.btn-secondary {
    color: white;
}

section {
    padding: 75px 7%;
}

.section-title {
    text-align: center;
    margin-bottom: 45px;
}

.section-title h2 {
    font-size: 38px;
}

.section-title p {
    color: #aebdcd;
    margin-top: 8px;
}

.about {
    background: #0b1828;
}

.about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 35px;
    align-items: center;
}

.about-box {
    background: #101f32;
    padding: 30px;
    border-radius: 15px;
    border: 1px solid #25384e;
}

.about-box h3 {
    color: #f5c400;
    margin-bottom: 12px;
}

.programs {
    background: #07111f;
}

.program-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

.program {
    background: #101f32;
    border: 1px solid #293d54;
    border-radius: 15px;
    padding: 30px;
    transition: .3s;
}

.program:hover {
    transform: translateY(-7px);
    border-color: #f5c400;
}

.program-number {
    color: #f5c400;
    font-size: 15px;
    font-weight: 900;
}

.program h3 {
    font-size: 28px;
    margin: 8px 0;
}

.program p {
    color: #b9c7d6;
}

.features {
    background: #0b1828;
}

.feature-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.feature {
    text-align: center;
    background: #101f32;
    padding: 25px 15px;
    border-radius: 12px;
}

.feature-icon {
    font-size: 35px;
    margin-bottom: 10px;
}

.feature h3 {
    font-size: 17px;
}
