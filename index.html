<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="BBW Football Academy - Talent Discovery, Player Development and Professional Exposure.">

<title>BBW Football Academy | Talent Discovery & Player Development</title>

<style>
:root{
    --navy:#03152f;
    --navy-dark:#020e20;
    --navy-light:#082653;
    --blue:#0d438b;
    --gold:#ffd21a;
    --white:#fff;
    --light:#f4f6f9;
    --text:#0a1d3b;
    --muted:#68758a;
    --shadow:0 20px 50px rgba(0,0,0,.25);
    --container:1180px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--navy);
    color:white;
    overflow-x:hidden;
}

img{
    max-width:100%;
    display:block;
}

a{
    text-decoration:none;
    color:inherit;
}

button{
    font-family:inherit;
}

.container{
    width:min(92%,var(--container));
    margin:auto;
}

/* ================= HEADER ================= */

.header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:9999;
    background:rgba(2,18,43,.92);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.nav{
    min-height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
}

.logo img{
    width:64px;
    height:64px;
    object-fit:contain;
}

.logo-text strong{
    display:block;
    font-size:23px;
    line-height:1;
    font-weight:900;
}

.logo-text span{
    display:block;
    font-size:10px;
    font-weight:700;
    letter-spacing:1.4px;
    margin-top:4px;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:28px;
    font-size:13px;
    font-weight:700;
}

.nav-links a{
    position:relative;
    padding:29px 0;
    transition:.3s;
}

.nav-links a:hover,
.nav-links a.active{
    color:var(--gold);
}

.nav-links a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:18px;
    width:100%;
    height:3px;
    background:var(--gold);
    transform:scaleX(0);
    transition:.3s;
}

.nav-links a:hover::after,
.nav-links a.active::after{
    transform:scaleX(1);
}

.header-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:13px 22px;
    border-radius:50px;
    background:var(--gold);
    color:var(--navy);
    font-size:13px;
    font-weight:900;
    transition:.3s;
}

.header-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 25px rgba(255,210,26,.25);
}

.menu-btn{
    display:none;
    background:none;
    border:0;
    color:white;
    font-size:29px;
    cursor:pointer;
}

/* ================= HERO ================= */

.hero{
    min-height:720px;
    display:flex;
    align-items:center;
    padding-top:100px;
    position:relative;

    background:
        linear-gradient(
            90deg,
            rgba(1,14,34,.98) 0%,
            rgba(3,23,50,.90) 38%,
            rgba(3,23,50,.50) 68%,
            rgba(3,23,50,.15) 100%
        ),
        url("https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=2200&q=90")
        center/cover no-repeat;
}

.hero::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:120px;
    background:linear-gradient(transparent,rgba(3,21,47,.75));
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:650px;
}

.eyebrow{
    display:flex;
    align-items:center;
    gap:13px;
    font-size:12px;
    font-weight:900;
    letter-spacing:5px;
    text-transform:uppercase;
    margin-bottom:10px;
}

.eyebrow::before{
    content:"";
    width:35px;
    height:3px;
    background:var(--gold);
    border-radius:5px;
}

.hero h1{
    text-transform:uppercase;
    font-size:clamp(52px,7vw,88px);
    line-height:.92;
    letter-spacing:-3px;
    margin-bottom:18px;
}

.hero h1 .white{
    display:block;
}

.hero h1 .gold{
    display:block;
    color:var(--gold);
}

.hero-tagline{
    font-size:19px;
    font-weight:800;
    margin-bottom:15px;
}

.hero-tagline span{
    color:var(--gold);
    margin:0 7px;
}

.hero-description{
    max-width:570px;
    color:#dbe4f0;
    font-size:15px;
    line-height:1.55;
    margin-bottom:28px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:13px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:46px;
    padding:13px 24px;
    border-radius:50px;
    font-size:13px;
    font-weight:900;
    transition:.3s;
}

.btn-gold{
    background:var(--gold);
    color:var(--navy);
}

.btn-gold:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 25px rgba(255,210,26,.25);
}

.btn-outline{
    border:1px solid white;
    color:white;
}

.btn-outline:hover{
    background:white;
    color:var(--navy);
}

/* ================= FEATURE STRIP ================= */

.feature-strip{
    background:#041a37;
    border-top:1px solid rgba(255,210,26,.35);
    border-bottom:1px solid rgba(255,255,255,.12);
}

.feature-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.feature{
    display:flex;
    align-items:center;
    gap:16px;
    min-height:92px;
    padding:15px 22px;
    border-right:1px solid rgba(255,255,255,.2);
}

.feature:last-child{
    border-right:0;
}

.feature-icon{
    color:var(--gold);
    font-size:31px;
    flex-shrink:0;
}

.feature h3{
    font-size:13px;
    margin-bottom:3px;
}

.feature p{
    color:#b7c4d6;
    font-size:10px;
    line-height:1.35;
}

/* ================= ABOUT ================= */

.about{
    background:var(--navy-dark);
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    min-height:430px;
}

.about-image{
    position:relative;
    min-height:430px;
    overflow:hidden;
}

.about-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.about-content{
    padding:60px 50px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.section-kicker{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:10px;
    font-weight:900;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:10px;
}

.section-kicker::before{
    content:"";
    width:24px;
    height:3px;
    background:var(--gold);
}

.section-title{
    font-size:clamp(31px,4vw,46px);
    line-height:1.05;
    margin-bottom:15px;
}

.section-title .gold{
    color:var(--gold);
}

.about-content>p{
    color:#bec9d8;
    max-width:530px;
    font-size:14px;
    line-height:1.55;
    margin-bottom:28px;
}

.about-icons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    border-top:1px solid rgba(255,255,255,.16);
}

.about-icon{
    text-align:center;
    padding:18px 10px 0;
    border-right:1px solid rgba(255,255,255,.16);
}

.about-icon:last-child{
    border-right:0;
}

.about-icon span{
    display:block;
    color:var(--gold);
    font-size:26px;
    margin-bottom:7px;
}

.about-icon strong{
    display:block;
    font-size:10px;
}

/* ================= VISION ================= */

.vision{
    background:var(--light);
    color:var(--text);
    padding:65px 0;
}

.vision-grid{
    display:grid;
    grid-template-columns:.85fr 1.15fr;
    gap:50px;
    align-items:center;
}

.vision .section-kicker{
    color:var(--text);
}

.vision-title{
    color:var(--navy);
    font-size:clamp(34px,4vw,50px);
    line-height:1.02;
    margin-bottom:15px;
}

.vision-description{
    color:#56657b;
    font-size:14px;
    max-width:490px;
    margin-bottom:22px;
}

.vision-grid-box{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    border-left:1px solid #d5dbe4;
}

.vision-item{
    padding:20px;
    border-right:1px solid #d5dbe4;
}

.vision-item:nth-child(n+4){
    border-top:1px solid #d5dbe4;
}

.vision-item span{
    display:block;
    color:var(--navy);
    font-size:28px;
    margin-bottom:9px;
}

.vision-item h3{
    color:var(--navy);
    font-size:12px;
    margin-bottom:5px;
}

.vision-item p{
    color:#6c7889;
    font-size:10px;
    line-height:1.35;
}

/* ================= PLAYERS ================= */

.players{
    padding:70px 0;
    background:
        linear-gradient(rgba(3,22,48,.93),rgba(3,22,48,.93)),
        url("https://images.unsplash.com/photo-1526232761682-d26e03ac148e?auto=format&fit=crop&w=2200&q=85")
        center/cover no-repeat;
}

.players-header{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:30px;
    margin-bottom:30px;
}

.players-header p{
    color:#b7c5d7;
    max-width:420px;
    font-size:13px;
}

.players-title{
    font-size:clamp(33px,4vw,46px);
    line-height:1;
    margin-bottom:8px;
}

.players-title .gold{
    color:var(--gold);
}

.player-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.player-card{
    position:relative;
    overflow:hidden;
    background:#082653;
    border:1px solid rgba(255,255,255,.1);
    border-radius:8px;
    transition:.35s;
    cursor:pointer;
}

.player-card:hover{
    transform:translateY(-8px);
    border-color:var(--gold);
    box-shadow:0 20px 45px rgba(0,0,0,.35);
}

.player-image{
    height:285px;
    overflow:hidden;
    background:#0a315f;
}

.player-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.5s;
}

.player-card:hover .player-image img{
    transform:scale(1.06);
}

.player-info{
    padding:13px 13px 15px;
    background:#061d40;
}

.player-info h3{
    font-size:13px;
    text-transform:uppercase;
    margin-bottom:2px;
}

.player-info p{
    color:#aebed1;
    font-size:10px;
}

.player-arrow{
    position:absolute;
    right:10px;
    bottom:10px;
    width:27px;
    height:27px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:var(--gold);
    color:var(--navy);
    font-weight:900;
}

/* ================= PLAYER PROFILE ================= */

.player-profile{
    position:fixed;
    inset:0;
    z-index:10000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    visibility:hidden;
    opacity:0;
    transition:.3s ease;
}

.player-profile.show{
    visibility:visible;
    opacity:1;
}

.player-profile-overlay{
    position:absolute;
    inset:0;
    background:rgba(0,8,20,.86);
    backdrop-filter:blur(8px);
}

.player-profile-card{
    position:relative;
    z-index:2;
    width:min(900px,100%);
    max-height:90vh;
    overflow:auto;
    display:grid;
    grid-template-columns:.85fr 1.15fr;
    background:#061d40;
    border:1px solid rgba(255,210,26,.4);
    border-radius:16px;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
}

.player-profile-photo{
    min-height:500px;
}

.player-profile-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.player-profile-content{
    padding:50px 40px;
}

.player-profile-kicker{
    color:var(--gold);
    font-size:10px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:12px;
}

.player-profile-content h2{
    font-size:42px;
    margin-bottom:8px;
}

.player-profile-position{
    color:#b9c8da;
    font-size:15px;
    margin-bottom:30px;
}

.player-profile-details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:30px;
}

.player-detail{
    padding:15px;
    background:#082653;
    border:1px solid rgba(255,255,255,.08);
    border-radius:8px;
}

.player-detail span{
    display:block;
    color:#8fa1b8;
    font-size:9px;
    font-weight:800;
    letter-spacing:1px;
    margin-bottom:5px;
}

.player-detail strong{
    font-size:14px;
}

.player-profile-description{
    border-top:1px solid rgba(255,255,255,.12);
    padding-top:25px;
}

.player-profile-description h3{
    color:var(--gold);
    font-size:14px;
    margin-bottom:10px;
}

.player-profile-description p{
    color:#bdc9d9;
    font-size:13px;
    line-height:1.7;
}

.player-profile-status{
    display:inline-block;
    margin-top:25px;
    padding:10px 15px;
    background:var(--gold);
    color:var(--navy);
    border-radius:30px;
    font-size:11px;
    font-weight:900;
}

.player-profile-close{
    position:absolute;
    top:15px;
    right:15px;
    z-index:5;
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.6);
    color:white;
    font-size:25px;
    cursor:pointer;
}

.player-profile-close:hover{
    background:var(--gold);
    color:var(--navy);
}

/* ================= GALLERY ================= */

.gallery{
    padding:55px 0;
    background:#041a37;
}

.gallery-grid{
    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:25px;
    align-items:center;
}

.gallery-images{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.gallery-images img{
    width:100%;
    height:165px;
    object-fit:cover;
    border-radius:5px;
}

.testimonial h2{
    font-size:26px;
    margin-bottom:10px;
}

.testimonial h2 .gold{
    color:var(--gold);
}

.quote{
    color:#c6d2e1;
    font-size:13px;
    line-height:1.5;
    margin-bottom:15px;
}

.testimonial-person{
    display:flex;
    align-items:center;
    gap:10px;
}

.testimonial-avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    object-fit:cover;
}

.testimonial-person strong{
    display:block;
    font-size:11px;
}

.testimonial-person span{
    color:#aab8ca;
    font-size:9px;
}

.stars{
    color:var(--gold);
    margin-left:auto;
}

/* ================= CTA ================= */

.cta{
    padding:52px 0;
    background:
        linear-gradient(90deg,rgba(3,22,48,.97),rgba(3,22,48,.76)),
        url("https://images.unsplash.com/photo-1517466787929-bc90951d0974?auto=format&fit=crop&w=2200&q=85")
        center/cover no-repeat;
}

.cta-grid{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:30px;
}

.cta h2{
    font-size:clamp(31px,4vw,45px);
    margin-bottom:8px;
}

.cta h2 .gold{
    color:var(--gold);
}

.cta p{
    color:#bdc9d9;
    font-size:12px;
}

/* ================= FOOTER ================= */

.footer{
    background:#021127;
    padding:42px 0 20px;
}

.footer-main{
    display:grid;
    grid-template-columns:1.3fr 1fr 1fr;
    gap:50px;
    padding-bottom:30px;
    border-bottom:1px solid rgba(255,255,255,.13);
}

.footer-logo{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:13px;
}

.footer-logo img{
    width:65px;
    height:65px;
    object-fit:contain;
}

.footer-logo strong{
    display:block;
    font-size:23px;
}

.footer-logo span{
    display:block;
    font-size:9px;
    font-weight:bold;
    letter-spacing:1.5px;
}

.footer-about p{
    color:#8998ad;
    font-size:11px;
    max-width:290px;
}

.footer h4{
    font-size:13px;
    margin-bottom:13px;
}

.footer-links{
    display:grid;
    gap:7px;
    color:#9eacbf;
    font-size:11px;
}

.footer-links a:hover{
    color:var(--gold);
}

.contact-item{
    display:flex;
    gap:8px;
    color:#9eacbf;
    font-size:11px;
    margin-bottom:9px;
}

.socials{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.socials a{
    width:31px;
    height:31px;
    display:grid;
    place-items:center;
    border:1px solid rgba(255,255,255,.25);
    border-radius:50%;
    transition:.3s;
}

.socials a:hover{
    color:var(--navy);
    background:var(--gold);
    border-color:var(--gold);
}

.footer-bottom{
    padding-top:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    color:#74849a;
    font-size:9px;
}

.motto{
    color:var(--gold);
    letter-spacing:4px;
    font-weight:900;
}

/* ================= MOBILE ================= */

@media(max-width:1000px){

    .nav-links{
        gap:17px;
    }

    .player-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .vision-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:760px){

    .nav{
        min-height:70px;
    }

    .logo img{
        width:53px;
        height:53px;
    }

    .logo-text strong{
        font-size:19px;
    }

    .menu-btn{
        display:block;
    }

    .header-btn{
        display:none;
    }

    .nav-links{
        position:absolute;
        top:74px;
        left:4%;
        right:4%;
        display:none;
        flex-direction:column;
        gap:0;
        padding:10px;
        background:#03152f;
        border:1px solid rgba(255,255,255,.12);
        border-radius:12px;
    }

    .nav-links.open{
        display:flex;
    }

    .nav-links a{
        padding:13px;
        border-bottom:1px solid rgba(255,255,255,.08);
    }

    .nav-links a::after{
        display:none;
    }

    .hero{
        min-height:680px;
        padding-top:135px;
    }

    .hero h1{
        font-size:52px;
    }

    .feature-grid{
        grid-template-columns:1fr 1fr;
    }

    .about-grid{
        grid-template-columns:1fr;
    }

    .about-image{
        min-height:350px;
    }

    .about-content{
        padding:50px 5%;
    }

    .about-icons{
        grid-template-columns:1fr 1fr;
    }

    .players-header{
        flex-direction:column;
        align-items:flex-start;
    }

    .gallery-grid{
        grid-template-columns:1fr;
    }

    .cta-grid{
        flex-direction:column;
        align-items:flex-start;
    }

    .footer-main{
        grid-template-columns:1fr 1fr;
    }

    .footer-about{
        grid-column:1/-1;
    }

    .player-profile-card{
        grid-template-columns:1fr;
        max-height:92vh;
    }

    .player-profile-photo{
        min-height:280px;
        height:280px;
    }

    .player-profile-content{
        padding:30px 25px;
    }

    .player-profile-content h2{
        font-size:32px;
    }
}

@media(max-width:500px){

    .container{
        width:90%;
    }

    .hero h1{
        font-size:48px;
    }

    .buttons{
        width:100%;
    }

    .buttons .btn{
        width:100%;
    }

    .feature-grid{
        grid-template-columns:1fr;
    }

    .feature{
        border-right:0;
        border-bottom:1px solid rgba(255,255,255,.12);
    }

    .player-grid{
        grid-template-columns:1fr 1fr;
        gap:8px;
    }

    .player-image{
        height:220px;
    }

    .player-info h3{
        font-size:10px;
    }

    .gallery-images{
        grid-template-columns:1fr 1fr;
    }

    .gallery-images img{
        height:135px;
    }

    .gallery-images img:last-child{
        display:none;
    }

    .footer-main{
        grid-template-columns:1fr;
    }

    .footer-about{
        grid-column:auto;
    }

    .footer-bottom{
