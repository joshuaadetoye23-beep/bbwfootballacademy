<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BBW Football Academy | Talent Discovery & Player Development</title>

<style>

/* =========================================================
   BBW FOOTBALL ACADEMY
   MODERN CINEMATIC LANDING PAGE
========================================================= */

:root {
    --navy: #03152f;
    --navy-dark: #020e20;
    --navy-light: #082653;
    --blue: #0d438b;
    --gold: #ffd21a;
    --gold-dark: #e6ad00;
    --white: #ffffff;
    --light: #f4f6f9;
    --text: #0a1d3b;
    --muted: #68758a;
    --border: rgba(255,255,255,.15);
    --shadow: 0 20px 50px rgba(0,0,0,.25);
    --container: 1180px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--navy);
    color: var(--white);
    overflow-x: hidden;
}

img {
    max-width: 100%;
    display: block;
}

a {
    text-decoration: none;
    color: inherit;
}

button {
    font-family: inherit;
}

.container {
    width: min(92%, var(--container));
    margin: auto;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 9999;

    background: rgba(2, 18, 43, .90);
    backdrop-filter: blur(14px);

    border-bottom: 1px solid rgba(255,255,255,.08);
}

.nav {
    min-height: 76px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 25px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
}

.logo img {
    width: 64px;
    height: 64px;
    object-fit: contain;
}

.logo-text strong {
    display: block;

    color: white;

    font-size: 23px;
    line-height: 1;

    font-weight: 900;
}

.logo-text span {
    display: block;

    color: white;

    font-size: 10px;
    font-weight: 700;

    letter-spacing: 1.4px;

    margin-top: 4px;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 28px;

    font-size: 13px;
    font-weight: 700;

    color: white;
}

.nav-links a {
    position: relative;
    padding: 29px 0;

    transition: .3s;
}

.nav-links a:hover,
.nav-links a.active {
    color: var(--gold);
}

.nav-links a::after {
    content: "";

    position: absolute;

    left: 0;
    bottom: 18px;

    width: 100%;
    height: 3px;

    background: var(--gold);

    transform: scaleX(0);
    transition: .3s;
}

.nav-links a:hover::after,
.nav-links a.active::after {
    transform: scaleX(1);
}

.header-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    padding: 13px 22px;

    border-radius: 50px;

    background: var(--gold);
    color: var(--navy);

    font-size: 13px;
    font-weight: 900;

    transition: .3s;
}

.header-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(255,210,26,.25);
}

.menu-btn {
    display: none;

    background: none;
    border: none;

    color: white;

    font-size: 29px;

    cursor: pointer;
}

/* =========================================================
   HERO
========================================================= */

.hero {
    min-height: 720px;

    display: flex;
    align-items: center;

    padding-top: 100px;

    position: relative;

    background:
        linear-gradient(
            90deg,
            rgba(1,14,34,.98) 0%,
            rgba(3,23,50,.90) 38%,
            rgba(3,23,50,.50) 68%,
            rgba(3,23,50,.15) 100%
        ),
        url("https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=2200&q=90")
        center/cover no-repeat;
}

.hero::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 120px;

    background: linear-gradient(
        transparent,
        rgba(3,21,47,.75)
    );

    pointer-events: none;
}

.hero-content {
    position: relative;
    z-index: 2;

    max-width: 650px;
}

.eyebrow {
    display: flex;
    align-items: center;
    gap: 13px;

    color: white;

    font-size: 12px;
    font-weight: 900;

    letter-spacing: 5px;

    text-transform: uppercase;

    margin-bottom: 10px;
}

.eyebrow::before {
    content: "";

    width: 35px;
    height: 3px;

    background: var(--gold);

    border-radius: 5px;
}

.hero h1 {
    text-transform: uppercase;

    font-size: clamp(52px, 7vw, 88px);

    line-height: .92;

    letter-spacing: -3px;

    margin-bottom: 18px;
}

.hero h1 .white {
    display: block;
    color: white;
}

.hero h1 .gold {
    display: block;
    color: var(--gold);
}

.hero-tagline {
    font-size: 19px;

    font-weight: 800;

    margin-bottom: 15px;
}

.hero-tagline span {
    color: var(--gold);

    margin: 0 7px;
}

.hero-description {
    max-width: 570px;

    color: #dbe4f0;

    font-size: 15px;

    line-height: 1.55;

    margin-bottom: 28px;
}

.buttons {
    display: flex;
    align-items: center;

    flex-wrap: wrap;

    gap: 13px;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    gap: 9px;

    min-height: 46px;

    padding: 13px 24px;

    border-radius: 50px;

    font-size: 13px;

    font-weight: 900;

    transition: .3s;
}

.btn-gold {
    background: var(--gold);
    color: var(--navy);
}

.btn-gold:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(255,210,26,.25);
}

.btn-outline {
    border: 1px solid white;
    color: white;
}

.btn-outline:hover {
    background: white;
    color: var(--navy);
}

/* =========================================================
   FEATURE STRIP
========================================================= */

.feature-strip {
    position: relative;
    z-index: 5;

    background: #041a37;

    border-top: 1px solid rgba(255,210,26,.35);
    border-bottom: 1px solid rgba(255,255,255,.12);
}

.feature-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
}

.feature {
    display: flex;
    align-items: center;

    gap: 16px;

    min-height: 92px;

    padding: 15px 22px;

    border-right: 1px solid rgba(255,255,255,.20);
}

.feature:last-child {
    border-right: none;
}

.feature-icon {
    flex-shrink: 0;

    width: 44px;
    height: 44px;

    display: grid;
    place-items: center;

    color: var(--gold);

    font-size: 31px;
}

.feature h3 {
    font-size: 13px;

    margin-bottom: 3px;
}

.feature p {
    color: #b7c4d6;

    font-size: 10px;

    line-height: 1.35;
}

/* =========================================================
   ABOUT SECTION
========================================================= */

.about {
    background: var(--navy-dark);

    padding: 0;
}

.about-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    min-height: 430px;
}

.about-image {
    position: relative;

    min-height: 430px;

    overflow: hidden;
}

.about-image img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

.about-image::after {
    content: "";

    position: absolute;

    top: 0;
    right: -1px;
    bottom: 0;

    width: 100px;

    background: var(--navy-dark);

    clip-path: polygon(100% 0, 100% 100%, 0 100%);
}

.about-label {
    position: absolute;

    left: 55px;
    bottom: 35px;

    z-index: 2;

    color: white;

    font-family: Georgia, serif;

    font-size: 28px;

    line-height: 1.05;

    font-style: italic;

    transform: rotate(-5deg);

    text-shadow: 0 4px 12px rgba(0,0,0,.6);
}

.about-label span {
    color: var(--gold);
}

.about-content {
    padding: 60px 50px;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.section-kicker {
    display: flex;
    align-items: center;

    gap: 12px;

    color: white;

    font-size: 10px;

    font-weight: 900;

    letter-spacing: 3px;

    text-transform: uppercase;

    margin-bottom: 10px;
}

.section-kicker::before {
    content: "";

    width: 24px;
    height: 3px;

    background: var(--gold);
}

.section-title {
    font-size: clamp(31px, 4vw, 46px);

    line-height: 1.05;

    letter-spacing: -1.5px;

    margin-bottom: 15px;
}

.section-title .gold {
    color: var(--gold);
}

.about-content > p {
    color: #bec9d8;

    max-width: 530px;

    font-size: 14px;

    line-height: 1.55;

    margin-bottom: 28px;
}

.about-icons {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    border-top: 1px solid rgba(255,255,255,.16);
}

.about-icon {
    text-align: center;

    padding: 18px 10px 0;

    border-right: 1px solid rgba(255,255,255,.16);
}

.about-icon:last-child {
    border-right: none;
}

.about-icon span {
    display: block;

    color: var(--gold);

    font-size: 26px;

    margin-bottom: 7px;
}

.about-icon strong {
    display: block;

    color: white;

    font-size: 10px;

    line-height: 1.25;
}

/* =========================================================
   VISION
========================================================= */

.vision {
    background: var(--light);

    color: var(--text);

    padding: 65px 0;
}

.vision-grid {
    display: grid;

    grid-template-columns: .85fr 1.15fr;

    gap: 50px;

    align-items: center;
}

.vision .section-kicker {
    color: var(--text);
}

.vision-title {
    color: var(--navy);

    font-size: clamp(34px, 4vw, 50px);

    line-height: 1.02;

    margin-bottom: 15px;
}

.vision-description {
    color: #56657b;

    font-size: 14px;

    max-width: 490px;

    margin-bottom: 22px;
}

.vision-grid-box {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    border-left: 1px solid #d5dbe4;
}

.vision-item {
    padding: 20px;

    border-right: 1px solid #d5dbe4;
}

.vision-item:nth-child(4),
.vision-item:nth-child(5),
.vision-item:nth-child(6) {
    border-top: 1px solid #d5dbe4;
}

.vision-item span {
    display: block;

    color: var(--navy);

    font-size: 28px;

    margin-bottom: 9px;
}

.vision-item h3 {
    color: var(--navy);

    font-size: 12px;

    margin-bottom: 5px;
}

.vision-item p {
    color: #6c7889;

    font-size: 10px;

    line-height: 1.35;
}

/* =========================================================
   PLAYERS SECTION
========================================================= */

.players {
    padding: 70px 0;

    background:
        linear-gradient(
            rgba(3,22,48,.93),
            rgba(3,22,48,.93)
        ),
        url("https://images.unsplash.com/photo-1526232761682-d26e03ac148e?auto=format&fit=crop&w=2200&q=85")
        center/cover no-repeat;
}

.players-header {
    display: flex;

    justify-content: space-between;

    align-items: end;

    gap: 30px;

    margin-bottom: 30px;
}

.players-header p {
    color: #b7c5d7;

    max-width: 420px;

    font-size: 13px;
}

.players-title {
    font-size: clamp(33px, 4vw, 46px);

    line-height: 1;

    margin-bottom: 8px;
}

.players-title .gold {
    color: var(--gold);
}

.player-grid {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 14px;
}

.player-card {
    position: relative;

    overflow: hidden;

    background: #082653;

    border: 1px solid rgba(255,255,255,.10);

    border-radius: 8px;

    transition: .35s;
}

.player-card:hover {
    transform: translateY(-8px);

    border-color: var(--gold);

    box-shadow: 0 20px 45px rgba(0,0,0,.35);
}

.player-image {
    position: relative;

    height: 285px;

    overflow: hidden;

    background: #0a315f;
}

.player-image img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    transition: .5s;
}

.player-card:hover .player-image img {
    transform: scale(1.06);
}

.player-info {
    padding: 13px 13px 15px;

    background: #061d40;
}

.player-info h3 {
    color: white;

    font-size: 13px;

    text-transform: uppercase;

    margin-bottom: 2px;
}

.player-info p {
    color: #aebed1;

    font-size: 10px;
}

.player-arrow {
    position: absolute;

    right: 10px;
    bottom: 10px;

    width: 27px;
    height: 27px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background: var(--gold);

    color: var(--navy);

    font-weight: 900;

    font-size: 14px;
}

/* =========================================================
   GALLERY / TESTIMONIAL
========================================================= */

.gallery {
    padding: 55px 0;

    background: #041a37;
}

.gallery-grid {
    display: grid;

    grid-template-columns: 1.15fr .85fr;

    gap: 25px;

    align-items: center;
}

.gallery-images {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 8px;
}

.gallery-images img {
    width: 100%;
    height: 165px;

    object-fit: cover;

    border-radius: 5px;
}

.gallery-images img:nth-child(2) {
    transform: translateY(15px);
}

.testimonial {
    padding: 15px 5px;
}

.testimonial .section-kicker {
    margin-bottom: 10px;
}

.testimonial h2 {
    font-size: 26px;

    margin-bottom: 10px;
}

.testimonial h2 .gold {
    color: var(--gold);
}

.quote {
    color: #c6d2e1;

    font-size: 13px;

    line-height: 1.5;

    margin-bottom: 15px;
}

.testimonial-person {
    display: flex;

    align-items: center;

    gap: 10px;
}

.testimonial-avatar {
    width: 38px;
    height: 38px;

    border-radius: 50%;

    object-fit: cover;
}

.testimonial-person strong {
    display: block;

    font-size: 11px;
}

.testimonial-person span {
    color: #aab8ca;

    font-size: 9px;
}

.stars {
    color: var(--gold);

    margin-left: auto;

    letter-spacing: 2px;
}

/* =========================================================
   CTA
========================================================= */

.cta {
    position: relative;

    overflow: hidden;

    padding: 52px 0;

    background:
        linear-gradient(
            90deg,
            rgba(3,22,48,.97),
            rgba(3,22,48,.76)
        ),
        url("https://images.unsplash.com/photo-1517466787929-bc90951d0974?auto=format&fit=crop&w=2200&q=85")
        center/cover no-repeat;
}

.cta::after {
    content: "";

    position: absolute;

    right: 0;
    top: 0;
    bottom: 0;

    width: 35%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,210,26,.08)
    );

    pointer-events: none;
}

.cta-grid {
    position: relative;

    z-index: 2;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 30px;
}

.cta h2 {
    font-size: clamp(31px, 4vw, 45px);

    line-height: 1;

    margin-bottom: 8px;
}

.cta h2 .gold {
    color: var(--gold);
}

.cta p {
    color: #bdc9d9;

    font-size: 12px;
}

/* =========================================================
   FOOTER
========================================================= */

.footer {
    background: #021127;

    padding: 42px 0 20px;
}

.footer-main {
    display: grid;

    grid-template-columns: 1.3fr 1fr 1fr;

    gap: 50px;

    padding-bottom: 30px;

    border-bottom: 1px solid rgba(255,255,255,.13);
}

.footer-logo {
    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 13px;
}

.footer-logo img {
    width: 65px;
    height: 65px;

    object-fit: contain;
}

.footer-logo strong {
    display: block;

    color: white;

    font-size: 23px;
}

.footer-logo span {
    display: block;

    color: white;

    font-size: 9px;

    font-weight: bold;

    letter-spacing: 1.5px;
}

.footer-about p {
    color: #8998ad;

    font-size: 11px;

    max-width: 290px;
}

.footer h4 {
    color: white;

    font-size: 13px;

    margin-bottom: 13px;
}

.footer-links {
    display: grid;

    gap: 7px;

    color: #9eacbf;

    font-size: 11px;
}

.footer-links a:hover {
    color: var(--gold);
}

.contact-item {
    display: flex;

    gap: 8px;

    color: #9eacbf;

    font-size: 11px;

    margin-bottom: 9px;
}

.socials {
    display: flex;

    gap: 8px;

    margin-top: 12px;
}

.socials a {
    width: 31px;
    height: 31px;

    display: grid;
    place-items: center;

    border: 1px solid rgba(255,255,255,.25);

    border-radius: 50%;

    color: white;

    font-size: 12px;

    transition: .3s;
}

.socials a:hover {
    color: var(--navy);

    background: var(--gold);

    border-color: var(--gold);
}

.footer-bottom {
    padding-top: 18px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    color: #74849a;

    font-size: 9px;
}

.motto {
    color: var(--gold);

    letter-spacing: 4px;

    font-weight: 900;
}

/* =========================================================
   MOBILE
========================================================= */

    .nav-links {
        gap: 17px;
    }

    .nav-links a {
        font-size: 11px;
    }

    .header-btn {
        padding: 11px 16px;
        font-size: 11px;
    }

    .about-grid {
        grid-template-columns: 1fr 1fr;
    }

    .player-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .vision-grid {
        grid-template-columns: 1fr;
    }
}
